version: '3.9'

services:
  api:
    image: ${REGISTRY}/berryx-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    deploy:
      replicas: 3
      update_config:
        parallelism: 1
        delay: 30s
        order: start-first
      rollback_config:
        parallelism: 1
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    environment:
      NODE_ENV: production
      PORT: 3001
    env_file:
      - .env.production
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - berryx-prod

  web:
    image: ${REGISTRY}/berryx-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    deploy:
      replicas: 2
    networks:
      - berryx-prod

  admin:
    image: ${REGISTRY}/berryx-admin:${IMAGE_TAG:-latest}
    restart: unless-stopped
    deploy:
      replicas: 1
    networks:
      - berryx-prod

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ../nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - certbot_data:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    ports:
      - "80:80"
      - "443:443"
    networks:
      - berryx-prod
    depends_on:
      - api
      - web
      - admin

  certbot:
    image: certbot/certbot
    volumes:
      - certbot_data:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    profiles:
      - ssl

volumes:
  certbot_data:
  certbot_www:

networks:
  berryx-prod:
    external: true
