name: Deploy

on:
  push:
    branches:
      - main       # → production
      - staging    # → staging
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options: [staging, production]
      image_tag:
        description: 'Image tag to deploy (leave empty for current SHA)'
        required: false

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}
  NODE_VERSION: '20'
  PNPM_VERSION: '9'

jobs:
  # ─── Build & Push Images ──────────────────────────────────────────────────
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/berryx
          tags: |
            type=sha,prefix=,format=short
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build & push API
        uses: docker/build-push-action@v5
        with:
          context: ./apps/api
          target: production
          push: true
          tags: ${{ env.REGISTRY }}/berryx-api:${{ steps.meta.outputs.version }},${{ env.REGISTRY }}/berryx-api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
          labels: ${{ steps.meta.outputs.labels }}

      - name: Build & push Web
        uses: docker/build-push-action@v5
        with:
          context: ./apps/web
          target: production
          push: true
          tags: ${{ env.REGISTRY }}/berryx-web:${{ steps.meta.outputs.version }},${{ env.REGISTRY }}/berryx-web:latest
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Build & push Admin
        uses: docker/build-push-action@v5
        with:
          context: ./apps/admin
          target: production
          push: true
          tags: ${{ env.REGISTRY }}/berryx-admin:${{ steps.meta.outputs.version }},${{ env.REGISTRY }}/berryx-admin:latest
          build-args: |
            NEXT_PUBLIC_ADMIN_API_URL=${{ secrets.NEXT_PUBLIC_ADMIN_API_URL }}
          cache-from: type=gha,scope=admin
          cache-to: type=gha,mode=max,scope=admin

  # ─── Deploy to Staging ────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: staging
    if: github.ref == 'refs/heads/staging' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging')
    steps:
      - name: Deploy to staging server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          envs: REGISTRY,IMAGE_TAG
          script: |
            IMAGE_TAG=${{ needs.build-and-push.outputs.image_tag }}
            cd /opt/berryx

            # Pull latest images
            docker pull $REGISTRY/berryx-api:$IMAGE_TAG
            docker pull $REGISTRY/berryx-web:$IMAGE_TAG
            docker pull $REGISTRY/berryx-admin:$IMAGE_TAG

            # Rolling deploy
            REGISTRY=$REGISTRY IMAGE_TAG=$IMAGE_TAG \
              docker stack deploy -c infrastructure/docker/docker-compose.prod.yml \
              --with-registry-auth berryx-staging

            # Wait for health
            sleep 30
            docker service ls | grep berryx-staging

      - name: Run smoke tests
        run: |
          curl -f https://staging.berryx.app/api/v1/health || exit 1
          echo "Staging health check passed"

      - name: Notify Slack
        if: always()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: 'Staging deploy ${{ job.status }} — tag: ${{ needs.build-and-push.outputs.image_tag }}'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}

  # ─── Deploy to Production ─────────────────────────────────────────────────
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')
    steps:
      - name: Deploy to production server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          envs: REGISTRY,IMAGE_TAG
          script: |
            IMAGE_TAG=${{ needs.build-and-push.outputs.image_tag }}
            cd /opt/berryx

            docker pull $REGISTRY/berryx-api:$IMAGE_TAG
            docker pull $REGISTRY/berryx-web:$IMAGE_TAG
            docker pull $REGISTRY/berryx-admin:$IMAGE_TAG

            REGISTRY=$REGISTRY IMAGE_TAG=$IMAGE_TAG \
              docker stack deploy -c infrastructure/docker/docker-compose.prod.yml \
              --with-registry-auth berryx

            # Monitor rollout
            echo "Waiting for rollout..."
            sleep 60
            docker service ls | grep berryx

      - name: Run production smoke tests
        run: |
          curl -f https://berryx.app/api/v1/health || exit 1
          echo "Production health check passed"

      - name: Create Sentry release
        uses: getsentry/action-release@v1
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: berryx
          SENTRY_PROJECT: berryx-api
        with:
          environment: production
          version: ${{ needs.build-and-push.outputs.image_tag }}

      - name: Notify Slack
        if: always()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: 'Production deploy ${{ job.status }} — tag: ${{ needs.build-and-push.outputs.image_tag }}'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}

  # ─── Rollback ─────────────────────────────────────────────────────────────
  rollback:
    name: Rollback Production
    runs-on: ubuntu-latest
    environment: production
    if: failure() && github.ref == 'refs/heads/main'
    needs: deploy-production
    steps:
      - name: Rollback to previous version
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            cd /opt/berryx
            PREV_TAG=$(cat .previous_tag || echo "latest")
            REGISTRY=$REGISTRY IMAGE_TAG=$PREV_TAG \
              docker stack deploy -c infrastructure/docker/docker-compose.prod.yml \
              --with-registry-auth berryx
            echo "Rolled back to $PREV_TAG"

      - name: Notify Slack on rollback
        uses: 8398a7/action-slack@v3
        with:
          status: custom
          custom_payload: |
            {"text": ":rotating_light: *PRODUCTION ROLLBACK TRIGGERED* — deploy failed, rolling back"}
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
